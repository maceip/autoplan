<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nucleus</title>
    <style>
      :root {
        --bg-window: #002028;
        --bg-surface: #002b36;
        --bg-card: #0c3540;
        --border-subtle: #133b45;
        --fg-primary: #e6f0f2;
        --fg-body: #c9d8db;
        --fg-muted: #8ca3a8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg-window);
        color: var(--fg-body);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui,
          sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .app-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
      }

      .titlebar {
        height: 36px;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-left: 76px;
        padding-right: 12px;
        background: var(--bg-window);
        border-bottom: 1px solid var(--border-subtle);
        -webkit-app-region: drag;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-primary);
      }

      .brand-title img {
        width: 16px;
        height: 16px;
      }

      .titlebar-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      .nav-btn {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--fg-muted);
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .nav-btn:hover {
        color: var(--fg-primary);
        background: rgba(255, 255, 255, 0.05);
      }

      .nav-btn.active {
        background: var(--bg-card);
        color: var(--fg-primary);
      }

      .viewport {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        background: var(--bg-surface);
      }

      .frame-view {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg-surface);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app-root" data-testid="nucleus-app-root">
      <header class="titlebar" data-testid="nucleus-titlebar">
        <div class="brand-title">
          <img src="/icon.png" alt="" />
          <span>Nucleus</span>
        </div>

        <nav class="titlebar-actions" aria-label="Nucleus navigation">
          <button
            type="button"
            class="nav-btn active"
            data-mode="workbench"
            data-testid="nucleus-mode-workbench"
          >
            Workbench
          </button>
          <button
            type="button"
            class="nav-btn"
            data-mode="editor"
            data-testid="nucleus-mode-editor"
          >
            Graph Studio
          </button>
        </nav>
      </header>

      <main class="viewport">
        <iframe
          id="workbench-frame"
          data-testid="nucleus-workbench-frame"
          class="frame-view"
          title="Workbench"
        ></iframe>

        <iframe
          id="editor-frame"
          data-testid="nucleus-editor-frame"
          class="frame-view hidden"
          title="Visual Editor"
        ></iframe>
      </main>
    </div>

    <script>
      (async () => {
        const wbFrame = document.getElementById('workbench-frame');
        const edFrame = document.getElementById('editor-frame');
        const modeBtns = Array.from(document.querySelectorAll('[data-mode]'));

        let backendUrl = 'http://127.0.0.1:5051';
        let webclawUrl = 'https://queue.secure.build';
        if (window.nucleusDesktop) {
          const info = await window.nucleusDesktop.getRuntimeInfo();
          if (info && info.backendUrl) backendUrl = info.backendUrl;
          if (info && info.webclawUrl) webclawUrl = info.webclawUrl;
        }

        wbFrame.src = webclawUrl.endsWith('/new') ? webclawUrl : `${webclawUrl}/new`;
        let editorLoaded = false;

        function setMode(mode) {
          modeBtns.forEach((btn) =>
            btn.classList.toggle('active', btn.dataset.mode === mode)
          );
          wbFrame.classList.toggle('hidden', mode !== 'workbench');
          edFrame.classList.toggle('hidden', mode !== 'editor');
          if (mode === 'editor' && !editorLoaded) {
            edFrame.src = `${backendUrl}/planai-editor`;
            editorLoaded = true;
          }
        }

        modeBtns.forEach((btn) => {
          btn.addEventListener('click', () => setMode(btn.dataset.mode));
        });
      })();
    </script>
  </body>
</html>
